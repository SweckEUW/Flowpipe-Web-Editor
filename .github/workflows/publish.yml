name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to push the release tag
    steps:
      # Checkout repository
      - uses: actions/checkout@v5

      # Setup Node.js and define npm registry
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Check whether the version from package.json is already published
      - name: Check version
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm - bump the version in package.json to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Install dependencies
      - name: Install
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      # Build project
      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build

      # Publish to npm
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Tag the published commit
      - name: Tag release
        if: steps.version.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
